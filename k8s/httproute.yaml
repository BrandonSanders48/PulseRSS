apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulser
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - rss.brandonsanders.org
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: pulser
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
